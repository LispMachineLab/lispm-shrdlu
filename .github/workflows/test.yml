name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # Emacs Common Lisp, which runs SHRDLU, and SHRDLU's Common Lisp,
      # from their own repositories.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/emacs-cl
          path: .deps/emacs-cl
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/www-shrdlu
          path: .deps/www-shrdlu
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test
        run: make test compile EMACS_CL=.deps/emacs-cl SHRDLU_SOURCE=.deps/www-shrdlu
